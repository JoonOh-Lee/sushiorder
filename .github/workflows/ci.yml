name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: sushiorder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local application.properties (CI test config)
        run: |
          cat > src/main/resources/application.properties <<'EOF'
          spring.application.name=sushiorder
          spring.datasource.url=jdbc:mariadb://localhost:3306/sushiorder?useUnicode=true&characterEncoding=UTF-8
          spring.datasource.username=root
          spring.datasource.password=1234
          spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
          spring.jpa.hibernate.ddl-auto=create
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
          spring.sql.init.mode=always
          spring.sql.init.encoding=UTF-8
          spring.jpa.defer-datasource-initialization=true
          spring.datasource.hikari.maximum-pool-size=20

          jwt.secret=ci-only-secret-do-not-use-in-prod-please-replace-me-1234567890
          jwt.expiration-ms=43200000
          EOF

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
