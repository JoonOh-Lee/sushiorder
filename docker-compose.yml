services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/sushiorder?useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-changeme-replace-with-a-long-random-base64-secret}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.2.2
    environment:
      MARIADB_DATABASE: sushiorder
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MARIADB_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data: