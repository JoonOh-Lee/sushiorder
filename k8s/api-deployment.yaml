apiVersion: apps/v1
kind: Deployment
metadata:
  name: sushiorder-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sushiorder-api
  template:
    metadata:
      labels:
        app: sushiorder-api
    spec:
      containers:
        - name: sushiorder-api
          image: sushiorder-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://sushiorder-db:3306/sushiorder?characterEncoding=UTF-8
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sushiorder-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sushiorder-secrets
                  key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: sushiorder-api
spec:
  selector:
    app: sushiorder-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP